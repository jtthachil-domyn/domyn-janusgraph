global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: domyn-nexus
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: compose-admin-token
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - nexus:8443
