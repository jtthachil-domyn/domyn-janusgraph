[project]
name = "domyngraph-rag"
version = "0.1.0"
description = "GraphRAG system for DomynGraph (JanusGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gremlinpython>=3.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.2.0",
    "pymupdf>=1.24.0",
    "toml>=0.10.2",
    "python-multipart>=0.0.9",
    "openai>=1.40.0",
    "numpy>=1.26.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
