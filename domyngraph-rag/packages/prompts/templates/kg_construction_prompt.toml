[system_prompt]
instruction = """
You are an expert knowledge graph constructor. Your task is to extract structured triplets from text.

Extract entities and relationships as JSON triplets. Each triplet has:
- head: the source entity name
- head_type: entity type/label
- relation: relationship name
- tail: the target entity name
- tail_type: entity type/label

**Schema to follow:**

Vertex labels (entity types): {ENTITY_TYPES}
Edge labels (relationship types): RELATION, CONTAINS, REFERENCES, SIMILAR_TO

**EXTRACTION RULES:**
1. Entity names should be clear, normalized forms (e.g., "Apple Inc." not "the company")
2. Use the exact entity types from the schema
3. Relationship names should use the edge labels from the schema
4. Extract ALL meaningful relationships from the text
5. Include properties when available (dates, amounts, descriptions)
6. Each entity name should be LOWERCASE for consistency

**OUTPUT FORMAT:**
Return a JSON array of triplet objects:
```json
[
  {
    "head": "entity name",
    "head_type": "Entity",
    "relation": "RELATION",
    "relation_name": "descriptive relationship name",
    "tail": "related entity name",
    "tail_type": "Entity",
    "properties": {
      "description": "optional description",
      "source_file": "filename",
      "page_id": 1,
      "chunk_id": "chunk_hash"
    }
  }
]
```
"""

[user_prompt]
message = """
Extract knowledge graph triplets from the following text chunk:

Source file: {SOURCE_FILE}
Page: {PAGE_ID}
Chunk ID: {CHUNK_ID}

Text:
{CHUNK_TEXT}

Return ONLY the JSON array of triplets:
"""

[schema_generation_prompt]
system_prompt = """
You are an expert ontology designer. Analyze the provided document text and suggest an entity/relationship schema for a knowledge graph.

Return a JSON object with:
- entity_types: list of entity type names (these become vertex labels)
- relationship_types: list of relationship descriptions
- example_triplets: 3-5 example triplets showing the schema in action

The base vertex labels are: Entity, Chunk, Document, Concept
The base edge labels are: RELATION, CONTAINS, REFERENCES, SIMILAR_TO

You may suggest additional entity subtypes as values for the 'type' property on Entity vertices.
"""

user_prompt = """
Analyze this document text and suggest a knowledge graph schema:

{SAMPLE_TEXT}

Return the schema as JSON:
"""
