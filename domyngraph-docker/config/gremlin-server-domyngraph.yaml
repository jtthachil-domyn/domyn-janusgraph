# =============================================================================
# DomynGraph Engine — Gremlin Server Configuration
# OLTP-focused: fixed thread pools, hard evaluation timeout
# =============================================================================

host: 0.0.0.0
port: 8182
evaluationTimeout: 120000
channelizer: org.apache.tinkerpop.gremlin.server.channel.WebSocketChannelizer
graphManager: org.janusgraph.graphdb.management.JanusGraphManager

# Thread pool isolation — prevents one tenant from starving others
threadPoolWorker: 8
gremlinPool: 16

graphs: {
  graph: /etc/opt/janusgraph/janusgraph.properties,
  ConfigurationManagementGraph: /etc/opt/janusgraph/janusgraph-configurationgraph.properties
}

scriptEngines: {
  gremlin-groovy: {
    plugins: {
      org.janusgraph.graphdb.tinkerpop.plugin.JanusGraphGremlinPlugin: {},
      org.janusgraph.domyn.procedures.DomynProcedurePlugin: {},
      org.janusgraph.domyn.algorithms.DomynAlgorithmPlugin: {},
      org.janusgraph.domyn.tenant.DomynTenantPlugin: {},
      org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {},
      org.apache.tinkerpop.gremlin.tinkergraph.jsr223.TinkerGraphGremlinPlugin: {},
      org.apache.tinkerpop.gremlin.jsr223.ImportGremlinPlugin: {classImports: [java.lang.Math], methodImports: [java.lang.Math#*]},
      org.apache.tinkerpop.gremlin.jsr223.ScriptFileGremlinPlugin: {files: [/opt/janusgraph/scripts/init-schema.groovy]}
    }
  }
}

processors:
  - { className: org.apache.tinkerpop.gremlin.server.op.session.SessionOpProcessor,
      config: { sessionTimeout: 28800000 }}
  - { className: org.apache.tinkerpop.gremlin.server.op.traversal.TraversalOpProcessor,
      config: { cacheExpirationTime: 600000, cacheMaxSize: 1000 }}

metrics: {
  consoleReporter: {enabled: true, interval: 180000},
  csvReporter: {enabled: false},
  jmxReporter: {enabled: true},
  slf4jReporter: {enabled: true, interval: 180000}
}

maxInitialLineLength: 4096
maxHeaderSize: 8192
maxChunkSize: 8192
maxContentLength: 10485760
maxAccumulationBufferComponents: 1024
resultIterationBatchSize: 256
writeBufferLowWaterMark: 65536
writeBufferHighWaterMark: 131072
