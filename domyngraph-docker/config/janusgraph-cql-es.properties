# =============================================================================
# DomynGraph Engine — JanusGraph Configuration (CQL + Elasticsearch)
# =============================================================================

# -- Storage Backend (Cassandra via CQL) --
storage.backend=cql
storage.hostname=cassandra
storage.cql.keyspace=domyngraph
storage.connection-pool-size=32
storage.buffer-size=2048

# -- Batch Loading (critical for ingestion performance) --
storage.batch-loading=true

# -- ID Management --
ids.block-size=1000000

# -- Index Backend (Elasticsearch) --
index.search.backend=elasticsearch
index.search.hostname=elasticsearch
index.search.index-name=domyngraph
index.search.elasticsearch.client-only=false

# -- Cache Configuration --
cache.db-cache=true
cache.db-cache-size=0.4
cache.db-cache-time=180000
cache.db-cache-clean-wait=20

# -- Transaction Log --
log.tx.key-consistent=true
