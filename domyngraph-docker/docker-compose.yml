services:

  cassandra:
    image: cassandra:4.1
    container_name: domyn-cassandra
    environment:
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=512M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - domyn-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: domyn-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - domyn-net

  janusgraph:
    build:
      context: ..
      dockerfile: domyngraph-docker/Dockerfile
    image: domyngraph:latest
    container_name: domyn-janusgraph
    ports:
      - "8182:8182"
    volumes:
      - ./config/janusgraph-cql-es.properties:/etc/opt/janusgraph/janusgraph.properties
      - ./config/janusgraph-configurationgraph.properties:/etc/opt/janusgraph/janusgraph-configurationgraph.properties
      - ./config/gremlin-server-domyngraph.yaml:/etc/opt/janusgraph/gremlin-server.yaml
      - ./config/gremlin-server-domyngraph.yaml:/opt/janusgraph/conf/janusgraph-server.yaml
      - ./scripts:/opt/janusgraph/scripts
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JAVA_OPTIONS=-Xms1G -Xmx2G
      - JANUS_PROPS_TEMPLATE=cql-es
      - janusgraph.storage.hostname=cassandra
      - janusgraph.storage.port=9042
      - janusgraph.storage.cql.keyspace=domyngraph
      - janusgraph.storage.cql.local-datacenter=datacenter1
      - janusgraph.index.search.hostname=elasticsearch
      - janusgraph.index.search.port=9200
      - janusgraph.index.search.elasticsearch.http.scheme=http
      - janusgraph.index.search.index-name=domyngraph
      - janusgraph.cache.db-cache=true
      - janusgraph.cache.db-cache-time=180000
      - janusgraph.cache.db-cache-size=0.25
      - janusgraph.schema.default=none
      - janusgraph.ids.block-size=100000
    healthcheck:
      test: ["CMD-SHELL", "bin/gremlin.sh -e /opt/janusgraph/scripts/health-check.groovy || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 90s
    networks:
      - domyn-net

  domyngraph-api:
    build:
      context: ../domyngraph-api
      dockerfile: Dockerfile
    container_name: domyn-api
    ports:
      - "8080:8080"
    depends_on:
      janusgraph:
        condition: service_healthy
    environment:
      - GREMLIN_HOST=janusgraph
      - GREMLIN_PORT=8182
      - GREMLIN_URL=ws://janusgraph:8182/gremlin
      - CORS_ORIGIN=http://localhost:3000
      - QUERY_TIMEOUT_S=10
      - PROCEDURE_TIMEOUT_S=30
      - MAX_EXPAND_NODES=100
      - CACHE_TTL_S=30
      - CACHE_MAX_SIZE=500
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - domyn-net

  domyngraph-ui:
    build:
      context: ../domyngraph-ui
      dockerfile: Dockerfile
    container_name: domyn-ui
    ports:
      - "3000:80"
    depends_on:
      domyngraph-api:
        condition: service_healthy
    networks:
      - domyn-net

volumes:
  cassandra-data:
  es-data:

networks:
  domyn-net:
    driver: bridge
